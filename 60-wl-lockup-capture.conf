# 60-wl-lockup-capture.conf -- make a hard lock leave evidence.
#
# Install:  sudo install -o root -g root -m 0644 \
#             ~/projects/macbookair2014/60-wl-lockup-capture.conf \
#             /etc/sysctl.d/60-wl-lockup-capture.conf
#           sudo sysctl --system
#
# WHY THIS EXISTS
#   The whole-system lock described in WIFI.md has never left a record. The
#   reason is not that nothing detects it -- something already does:
#
#       kernel.nmi_watchdog  = 1        measured on 7.0.0-28, 2026-08-17
#       kernel.watchdog      = 1
#       CONFIG_HARDLOCKUP_DETECTOR=y    present in this kernel
#
#   THE HARD-LOCKUP DETECTOR HAS BEEN RUNNING FOR MONTHS. On detection it
#   prints "Watchdog detected hard LOCKUP on cpu N" -- into a journal that a
#   locked machine never flushes. The sensor works; the consumer does not
#   exist. That is this project's signature failure and this file is the fix.
#
# WHAT EACH SETTING DOES, and why it is safe here
#
#   hardlockup_panic=1  Converts detection into a panic. A panic is captured by
#                       pstore into EFI NVRAM, which SURVIVES the lock and is
#                       archived to /var/lib/systemd/pstore/ on the next boot.
#                       pstore capture was PROVEN working on this machine on
#                       2026-08-17 -- a real 18-fragment record from 08-08
#                       exists. Read it with pstore-read.sh, never by looking
#                       at /sys/fs/pstore, which is empty by design.
#
#   panic_on_oops=1     An Oops that would previously limp on now panics and is
#                       therefore recorded. The one archived record on this box
#                       is a facetimehd Oops that the machine SURVIVED for 52
#                       minutes -- so this changes behaviour: such an event now
#                       reboots. That is the trade: evidence over uptime.
#
#   panic=30            Auto-reboot 30s after a panic, so the box recovers
#                       itself and the record gets archived, instead of sitting
#                       bricked until someone walks past. 30s rather than
#                       instant leaves time to photograph a console message.
#
# WHAT THIS DOES NOT DO
#   It does not help a SOFT hang that never trips the detector, and it does not
#   make wl any less likely to wedge. It only ensures that if the kernel notices,
#   the noticing survives the reboot. softlockup_panic is deliberately NOT set:
#   soft lockups on a 4GB laptop under memory pressure are not always fatal and
#   panicking on them would trade a usable machine for noise.

kernel.hardlockup_panic = 1
kernel.panic_on_oops = 1
kernel.panic = 30
